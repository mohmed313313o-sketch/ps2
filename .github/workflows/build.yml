name: Build MuhanakPS2 Full APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          yes | sdkmanager --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MuhanakPS2-Full-APK
          path: app/build/outputs/apk/debug/*.apk
